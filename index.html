<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Decryption dari URL</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .box {
            padding: 15px;
            background: #e8f5e9;
            border-left: 5px solid #4caf50;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <h3>Data dari Flutter:</h3>

    <div class="label">Teks Terenkripsi (Dari URL):</div>
    <div id="teksEnkripsi" class="box" style="background: #f0f0f0; border-color: #999;">Menunggu...</div>

    <div class="label">Hasil Dekripsi:</div>
    <div id="hasilDekripsi" class="box">Menunggu...</div>

    <script>
        // Gunakan kunci rahasia yang sama dengan Flutter
        const SECRET_KEY = "4D4UFBA5abaqdXKFCm0i0Aa9dOyYfKPy";

        async function decryptAESGCM(base64Payload, secretKeyString) {
            try {
                const binaryString = atob(base64Payload);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const iv = bytes.slice(0, 12);
                const ciphertext = bytes.slice(12);

                const enc = new TextEncoder();
                const keyMaterial = enc.encode(secretKeyString);
                const cryptoKey = await crypto.subtle.importKey(
                    "raw", keyMaterial, "AES-GCM", false, ["decrypt"]
                );

                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, cryptoKey, ciphertext
                );

                return new TextDecoder().decode(decryptedBuffer);
            } catch (error) {
                console.error(error);
                return "❌ Gagal: Data rusak atau kunci salah!";
            }
        }

        // Otomatis berjalan saat halaman dimuat
        window.onload = async () => {
            // Membaca parameter URL (misal: ?data=xyz123)
            const urlParams = new URLSearchParams(window.location.search);
            const payloadDariUrl = urlParams.get('data');

            if (payloadDariUrl) {
                // Tampilkan teks terenkripsi asli di layar
                document.getElementById("teksEnkripsi").innerText = payloadDariUrl;

                // Mulai dekripsi
                const hasil = await decryptAESGCM(payloadDariUrl, SECRET_KEY);
                document.getElementById("hasilDekripsi").innerText = hasil;
            } else {
                document.getElementById("teksEnkripsi").innerText = "Tidak ada parameter ?data= di URL";
                document.getElementById("hasilDekripsi").innerText = "-";
            }
        };
    </script>
</body>

</html>
